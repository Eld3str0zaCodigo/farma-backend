<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - Farmacia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
  <div class="container" style="max-width: 400px;">
    <div class="card shadow p-4">
      <h3 class="text-center mb-3">Crear Cuenta</h3>
      <form id="formRegister" novalidate>
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" id="username" class="form-control" required minlength="3">
          <div class="invalid-feedback">El usuario debe tener al menos 3 caracteres.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Correo Electrónico</label>
          <input type="email" id="email" class="form-control" required>
          <div class="invalid-feedback">Ingrese un correo válido.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control" required minlength="6">
          <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
        <div class="text-center mt-3">
          <a href="index.html">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('formRegister').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      
      // Validación Frontend
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      const bodyData = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('http://localhost:4000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });
        const data = await res.json();
        
        if (res.ok) {
          alert('¡Cuenta creada con éxito! Inicia sesión.');
          window.location.href = 'index.html';
        } else {
          alert('Error: ' + (data.error || 'No se pudo registrar'));
        }
      } catch (err) {
        alert('Error en el servidor');
      }
    });
  </script>
</body>
</html>
